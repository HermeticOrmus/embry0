# Managed app on the vibium browser backend behind an auth wall (#234).
# The orchestrator writes the storageState to $QA_STORAGE_STATE_PATH,
# converted to vibium's native single-origin restore shape; the agent
# applies it itself: browser_start -> navigate(frontend_url) ->
# browser_restore_storage($QA_STORAGE_STATE_PATH) -> navigate again
# (web-storage restore only works on-origin — verified on 26.8.21). A login
# screen persisting after the reload is an auth failure, never an
# invitation to log in.
version: 2

workspace_provider:
  type: npm-workspaces-turbo
  config: {}

defaults:
  mode: process
  sandbox_profile: qa-jvm
  browser_backend: vibium
  ready_checks:
    - http: "http://localhost:3000"
      expect_status: [200, 302, 401]
      expect_body_regex: null
  boot_timeout_seconds: 300
  acceptance_criteria_template:
    - "dashboard loads with the signed-in user's name visible"

qa_required: always

apps:
  web:
    boot_command: "npm run dev"
    frontend_url: "http://localhost:3000"
    auth:
      storage_state_from:
        secret: QA_STORAGE_STATE
