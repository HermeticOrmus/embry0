# Browser-backend selection at every layer (#229). Precedence:
# job override > app_local > app > defaults > deployment default.
# `web` inherits the defaults layer; `admin` overrides per-app; `api`
# is overridden again by app_local (the strongest yaml layer).
version: 2

workspace_provider:
  type: npm-workspaces-turbo
  config: {}

defaults:
  mode: process
  sandbox_profile: qa-jvm
  browser_backend: playwright
  ready_checks:
    - http: "http://localhost:3000"
      expect_status: 200
      expect_body_regex: null
  boot_timeout_seconds: 300
  acceptance_criteria_template:
    - "page loads"

qa_required: auto

apps:
  web:
    boot_command: "npm run dev"
    frontend_url: "http://localhost:3000"
  admin:
    boot_command: "npm run dev:admin"
    frontend_url: "http://localhost:3001"
    browser_backend: playwright
  api:
    boot_command: "npm run dev:api"
    frontend_url: "http://localhost:3002"

app_local:
  api:
    browser_backend: playwright
