# Drop-in for embry0.service under AGENT_RUNTIME=rootless (#268): wait for the
# rootless sandbox daemon before `docker compose up`. It is a user service of
# the sandbox account, started at boot by lingering, and nothing else orders
# the stack after it; without the wait, init-sandbox-networks can run before
# the socket exists, fail, and leave the orchestrator never started.
# The unit's User (embry0) must be in the sandbox account's group.
# Install: docs/ops/provisioning.md, "A rootless sandbox daemon".
[Service]
Environment=EMBRY0_SANDBOX_DOCKER_HOST=unix:///run/embry0-sandbox/docker.sock
ExecStartPre=/bin/sh -c 'for i in $(seq 1 90); do DOCKER_HOST=$EMBRY0_SANDBOX_DOCKER_HOST docker info >/dev/null 2>&1 && exit 0; sleep 2; done; echo "the rootless sandbox daemon is not answering on $EMBRY0_SANDBOX_DOCKER_HOST" >&2; exit 1'
